services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ChangeMe_LocalOnly_123
    ports:
      - "14333:1433"
    volumes:
      - acdc-sql-data:/var/opt/mssql

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - acdc-azurite-data:/data

volumes:
  acdc-sql-data:
  acdc-azurite-data:
